[build]
  command = "pnpm --filter @workspace/ng-travels run build"
  publish = "artifacts/ng-travels/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"
  PNPM_VERSION = "9.15.9"

# Reverse Proxy /api/* to production backend (avoids CORS issues on web)
[[redirects]]
  from = "/api/*"
  to = "https://ng-travels-operations.vercel.app/api/:splat"
  status = 200
  force = true

# SPA fallback: ensure all React Router / Wouter URLs resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
