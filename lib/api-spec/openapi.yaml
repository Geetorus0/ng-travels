openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NG Travels travel operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
  - name: customers
  - name: trips
  - name: payments
  - name: expenses
  - name: reports
  - name: notifications
  - name: audit
  - name: settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get owner dashboard
      responses:
        "200":
          description: Dashboard summary and today's schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: Search customers
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paginated customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: archiveCustomer
      tags: [customers]
      summary: Archive a customer
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204": { description: Archived }
  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List trips
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Paginated trips
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripList"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripInput"
      responses:
        "201":
          description: Created trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
  /trips/{id}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get trip detail
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTrip
      tags: [trips]
      summary: Update trip
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripUpdate"
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
  /trips/{id}/status:
    post:
      operationId: updateTripStatus
      tags: [trips]
      summary: Update trip status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripStatusInput"
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
  /trips/{id}/operations:
    patch:
      operationId: updateTripOperations
      tags: [trips]
      summary: Save driver operational values
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripOperationsInput"
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
  /trips/{id}/payments:
    get:
      operationId: listTripPayments
      tags: [payments]
      summary: List payments for a trip
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
    post:
      operationId: createTripPayment
      tags: [payments]
      summary: Add a payment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /trips/{id}/expenses:
    get:
      operationId: listTripExpenses
      tags: [expenses]
      summary: List operational expenses
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Expense" }
    post:
      operationId: createTripExpense
      tags: [expenses]
      summary: Add an operational expense
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Get report summary
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: tripType
          schema: { type: string }
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get workspace settings
      responses:
        "200":
          description: Workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update workspace settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    NotFound:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    Customer:
      type: object
      required: [id, customerId, name, mobile, createdAt, totalTrips, totalPaid, pending]
      properties:
        id: { type: integer }
        customerId: { type: string }
        name: { type: string }
        mobile: { type: string }
        whatsapp: { type: ["string", "null"] }
        alternateNumber: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        totalTrips: { type: integer }
        totalPaid: { type: number }
        pending: { type: number }
        lastTrip: { type: ["string", "null"], format: date }
        commonDestinations:
          type: array
          items: { type: string }
    CustomerInput:
      type: object
      required: [name, mobile]
      properties:
        name: { type: string, minLength: 2 }
        mobile: { type: string, minLength: 7 }
        whatsapp: { type: string }
        alternateNumber: { type: string }
        email: { type: string, format: email }
        address: { type: string }
        notes: { type: string }
    CustomerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        mobile: { type: string, minLength: 7 }
        whatsapp: { type: string }
        alternateNumber: { type: string }
        email: { type: string, format: email }
        address: { type: string }
        notes: { type: string }
    CustomerList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    Location:
      type: object
      required: [name, address]
      properties:
        name: { type: string }
        address: { type: string }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        placeId: { type: ["string", "null"] }
    Trip:
      type: object
      required:
        [id, bookingId, customerId, customerName, customerMobile, tripType, pickup, destination, startDate, startTime, passengerCount, status, mapDistanceKm, billingKm, ratePerKm, baseFare, toll, parking, otherCharges, customerTotal, totalPaid, remainingBalance, credit, createdAt]
      properties:
        id: { type: integer }
        bookingId: { type: string }
        customerId: { type: integer }
        customerName: { type: string }
        customerMobile: { type: string }
        tripType: { type: string }
        pickup: { $ref: "#/components/schemas/Location" }
        destination: { $ref: "#/components/schemas/Location" }
        stops:
          type: array
          items: { $ref: "#/components/schemas/Location" }
        startDate: { type: string, format: date }
        startTime: { type: string }
        returnDate: { type: ["string", "null"], format: date }
        returnTime: { type: ["string", "null"] }
        passengerCount: { type: integer }
        notes: { type: ["string", "null"] }
        specialInstructions: { type: ["string", "null"] }
        status: { type: string }
        mapDistanceKm: { type: number }
        routeDurationMinutes: { type: ["integer", "null"] }
        routeSummary: { type: ["string", "null"] }
        apiEstimatedToll: { type: ["number", "null"] }
        billingKm: { type: number }
        ratePerKm: { type: number }
        baseFare: { type: number }
        toll: { type: number }
        parking: { type: number }
        otherCharges: { type: number }
        customerTotal: { type: number }
        totalPaid: { type: number }
        remainingBalance: { type: number }
        credit: { type: number }
        startingKm: { type: ["number", "null"] }
        endingKm: { type: ["number", "null"] }
        actualKm: { type: ["number", "null"] }
        expenseTotal: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TripInput:
      type: object
      required: [customerId, customerName, customerMobile, tripType, pickup, destination, startDate, startTime, passengerCount, billingKm, ratePerKm]
      properties:
        customerId: { type: integer, minimum: 1 }
        customerName: { type: string }
        customerMobile: { type: string }
        tripType: { type: string }
        pickup: { $ref: "#/components/schemas/Location" }
        destination: { $ref: "#/components/schemas/Location" }
        stops:
          type: array
          items: { $ref: "#/components/schemas/Location" }
        startDate: { type: string, format: date }
        startTime: { type: string }
        returnDate: { type: string, format: date }
        returnTime: { type: string }
        passengerCount: { type: integer, minimum: 1 }
        notes: { type: string }
        specialInstructions: { type: string }
        mapDistanceKm: { type: number, minimum: 0 }
        routeDurationMinutes: { type: integer, minimum: 0 }
        routeSummary: { type: string }
        apiEstimatedToll: { type: number, minimum: 0 }
        billingKm: { type: number, exclusiveMinimum: 0 }
        ratePerKm: { type: number, exclusiveMinimum: 0 }
        toll: { type: number, minimum: 0 }
        parking: { type: number, minimum: 0 }
        otherCharges: { type: number, minimum: 0 }
        advance: { type: number, minimum: 0 }
    TripUpdate:
      type: object
      properties:
        tripType: { type: string }
        pickup: { $ref: "#/components/schemas/Location" }
        destination: { $ref: "#/components/schemas/Location" }
        stops:
          type: array
          items: { $ref: "#/components/schemas/Location" }
        startDate: { type: string, format: date }
        startTime: { type: string }
        returnDate: { type: string, format: date }
        returnTime: { type: string }
        passengerCount: { type: integer, minimum: 1 }
        notes: { type: string }
        specialInstructions: { type: string }
        mapDistanceKm: { type: number, minimum: 0 }
        routeDurationMinutes: { type: integer, minimum: 0 }
        routeSummary: { type: string }
        apiEstimatedToll: { type: number, minimum: 0 }
        billingKm: { type: number, exclusiveMinimum: 0 }
        ratePerKm: { type: number, exclusiveMinimum: 0 }
        toll: { type: number, minimum: 0 }
        parking: { type: number, minimum: 0 }
        otherCharges: { type: number, minimum: 0 }
    TripStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string }
        note: { type: string }
    TripOperationsInput:
      type: object
      properties:
        startingKm: { type: number, minimum: 0 }
        endingKm: { type: number, minimum: 0 }
        note: { type: string }
    TripList:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Trip" }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    Payment:
      type: object
      required: [id, tripId, amount, method, paymentType, paymentDate, createdAt]
      properties:
        id: { type: integer }
        tripId: { type: integer }
        amount: { type: number, minimum: 0 }
        method: { type: string }
        paymentType: { type: string }
        paymentDate: { type: string, format: date }
        reference: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    PaymentInput:
      type: object
      required: [amount, method, paymentType, paymentDate]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        method: { type: string }
        paymentType: { type: string }
        paymentDate: { type: string, format: date }
        reference: { type: string }
        notes: { type: string }
    Expense:
      type: object
      required: [id, tripId, category, amount, expenseDate, createdAt]
      properties:
        id: { type: integer }
        tripId: { type: integer }
        category: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        expenseDate: { type: string, format: date }
        notes: { type: ["string", "null"] }
        receiptPath: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    ExpenseInput:
      type: object
      required: [category, amount, expenseDate]
      properties:
        category: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        expenseDate: { type: string, format: date }
        notes: { type: string }
        receiptPath: { type: string }
    Dashboard:
      type: object
      required: [date, metrics, schedule, recentActivity]
      properties:
        date: { type: string, format: date }
        metrics:
          type: object
          required: [todaysTrips, upcomingTrips, started, inProgress, completedToday, paymentPending, todaysCollection, todaysExpenses, todaysProfit, weeklyRevenue, weeklyExpenses, weeklyProfit, monthlyRevenue, monthlyExpenses, monthlyProfit]
          properties:
            todaysTrips: { type: integer }
            upcomingTrips: { type: integer }
            started: { type: integer }
            inProgress: { type: integer }
            completedToday: { type: integer }
            paymentPending: { type: integer }
            todaysCollection: { type: number }
            todaysExpenses: { type: number }
            todaysProfit: { type: number }
            weeklyRevenue: { type: number }
            weeklyExpenses: { type: number }
            weeklyProfit: { type: number }
            monthlyRevenue: { type: number }
            monthlyExpenses: { type: number }
            monthlyProfit: { type: number }
        schedule:
          type: array
          items: { $ref: "#/components/schemas/ScheduleItem" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
    ScheduleItem:
      type: object
      required: [id, bookingId, time, pickup, destination, customerName, status]
      properties:
        id: { type: integer }
        bookingId: { type: string }
        time: { type: string }
        pickup: { type: string }
        destination: { type: string }
        customerName: { type: string }
        status: { type: string }
    ActivityItem:
      type: object
      required: [id, title, detail, timestamp]
      properties:
        id: { type: integer }
        title: { type: string }
        detail: { type: string }
        timestamp: { type: string, format: date-time }
    ReportSummary:
      type: object
      required: [from, to, totalTrips, completed, cancelled, billingKm, grossFare, toll, parking, otherCharges, collection, expenses, profit, pendingBalance, averageFare, paymentMethods, rows]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalTrips: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        billingKm: { type: number }
        grossFare: { type: number }
        toll: { type: number }
        parking: { type: number }
        otherCharges: { type: number }
        collection: { type: number }
        expenses: { type: number }
        profit: { type: number }
        pendingBalance: { type: number }
        averageFare: { type: number }
        topCustomer: { type: ["string", "null"] }
        topDestination: { type: ["string", "null"] }
        paymentMethods:
          type: array
          items:
            type: object
            required: [method, amount]
            properties:
              method: { type: string }
              amount: { type: number }
        rows:
          type: array
          items: { $ref: "#/components/schemas/Trip" }
    Notification:
      type: object
      required: [id, title, message, kind, isRead, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string }
        kind: { type: string }
        isRead: { type: boolean }
        tripId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
    AuditLog:
      type: object
      required: [id, action, entity, entityId, createdAt]
      properties:
        id: { type: integer }
        action: { type: string }
        entity: { type: string }
        entityId: { type: string }
        actorName: { type: ["string", "null"] }
        oldValue: { type: ["string", "null"] }
        newValue: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    Settings:
      type: object
      required: [company, mobile, email, currency, timezone, defaultRate]
      properties:
        company: { type: string }
        mobile: { type: string }
        email: { type: string }
        currency: { type: string }
        timezone: { type: string }
        defaultRate: { type: number, minimum: 0 }
    SettingsUpdate:
      type: object
      properties:
        company: { type: string }
        mobile: { type: string }
        email: { type: string }
        currency: { type: string }
        timezone: { type: string }
        defaultRate: { type: number, minimum: 0 }

